name: Browser Extension Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build Browser Extensions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Build extensions
        run: node scripts/build.js build

      - name: Upload Chrome/Edge extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: dist/chrome-extension.zip
          retention-days: 5

      - name: Upload Firefox extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: dist/firefox-extension.zip
          retention-days: 5

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Unit tests
        run: npm test

      - name: Install Playwright and Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Allow the tests to set an organization policy
        run: |
          sudo mkdir -p /etc/opt/chrome_for_testing/policies/managed
          sudo chown "$USER" /etc/opt/chrome_for_testing/policies/managed

      - name: Browser tests
        run: npm run test:e2e

  release:
    needs: build
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download Chrome Extension
        uses: actions/download-artifact@v4
        with:
          name: chrome-extension
          path: dist

      - name: Download Firefox Extension
        uses: actions/download-artifact@v4
        with:
          name: firefox-extension
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/chrome-extension.zip
            dist/firefox-extension.zip
          generate_release_notes: true
          draft: false
          prerelease: false

